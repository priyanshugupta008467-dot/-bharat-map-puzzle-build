name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q *.zip -d project
          cd project
          find . -name package.json -print

      - name: Install and prepare Android
        run: |
          cd project
          npm install
          npx cap add android
          npx cap sync android

      - name: Build AAB
        run: |
          cd project/android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Bharat-Map-Puzzle-AAB
          path: project/android/app/build/outputs/bundle/release/*.aab
